name: alanet
services:
  web:
    image: ${ALANET_WEB_IMAGE:-ghcr.io/alanet/alanet-web:latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    deploy:
      resources:
        limits:
          memory: 320M

  billing-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: ${BILLING_DB_PASSWORD}
    volumes:
      - billing-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M

  billing-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    deploy:
      resources:
        limits:
          memory: 96M

  api:
    image: ${ALANET_BACKEND_IMAGE:-ghcr.io/alanet/alanet-backend:latest}
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    volumes:
      - ../infra/node-registry.json:/opt/alanet/infra/node-registry.json:ro
      - /var/lib/alanet-monitor:/var/lib/alanet-monitor:ro
      - /var/backups/alanet:/var/backups/alanet:ro
    depends_on:
      billing-db:
        condition: service_healthy
      billing-redis:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=127.0.0.1"]
    networks:
      - default
      - remnawave-network
    deploy:
      resources:
        limits:
          memory: 256M

  worker:
    image: ${ALANET_BACKEND_IMAGE:-ghcr.io/alanet/alanet-backend:latest}
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    volumes:
      - ../infra/node-registry.json:/opt/alanet/infra/node-registry.json:ro
      - /var/lib/alanet-monitor:/var/lib/alanet-monitor:ro
      - /var/backups/alanet:/var/backups/alanet:ro
    depends_on:
      billing-db:
        condition: service_healthy
      billing-redis:
        condition: service_started
    command: ["celery", "-A", "app.worker.celery", "worker", "-B", "--loglevel=INFO", "--concurrency=1"]
    networks:
      - default
      - remnawave-network
    deploy:
      resources:
        limits:
          memory: 256M

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:9443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - default
      - remnawave-network

volumes:
  billing-data:
  caddy-data:
  caddy-config:

networks:
  remnawave-network:
    external: true
