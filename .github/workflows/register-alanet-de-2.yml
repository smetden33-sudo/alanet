name: Register ALANET-DE-2 in Remnawave

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/register-alanet-de-2.yml"
  workflow_dispatch:

concurrency:
  group: register-alanet-de-2
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest

    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add production host key
        run: ssh-keyscan -p "${{ secrets.PROD_SSH_PORT }}" -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts

      - name: Register Remnawave node and host
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          NODE_NAME: ALANET-DE-2
          NODE_ADDRESS: 144.31.214.244
          NODE_PORT: "2222"
          HOST_REMARK: "🇩🇪 Германия 2"
          HOST_ADDRESS: 144.31.214.244
          HOST_PORT: "2053"
          NODE_COUNTRY: DE
          CONFIG_PROFILE_NAME: COMMERCIAL-REALITY-DE-1
          INBOUND_TAG: VLESS_TCP_REALITY_DE_1
        run: |
          ssh -p "$PROD_SSH_PORT" "$PROD_USER@$PROD_HOST" \
            NODE_NAME="$NODE_NAME" \
            NODE_ADDRESS="$NODE_ADDRESS" \
            NODE_PORT="$NODE_PORT" \
            HOST_ADDRESS="$HOST_ADDRESS" \
            HOST_PORT="$HOST_PORT" \
            NODE_COUNTRY="$NODE_COUNTRY" \
            CONFIG_PROFILE_NAME="$CONFIG_PROFILE_NAME" \
            INBOUND_TAG="$INBOUND_TAG" \
            'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          HOST_REMARK="🇩🇪 Германия 2"

          token="$(sudo sed -n 's/^REMNAWAVE_TOKEN=//p' /opt/alanet/deploy/.env)"
          if [[ -z "$token" ]]; then
            echo "REMNAWAVE_TOKEN is missing on production" >&2
            exit 1
          fi

          auth=(-H "Authorization: Bearer ${token}")
          json_auth=("${auth[@]}" -H "Content-Type: application/json")
          base_url="https://panel.alanet.ru"

          profiles_json="$(curl --fail --silent --show-error "${auth[@]}" "${base_url}/api/config-profiles")"
          profile_uuid="$(
            jq -r --arg name "${CONFIG_PROFILE_NAME}" \
              '(.response | if type == "array" then . else (.configProfiles // []) end)[] | select(.name == $name) | .uuid' \
              <<<"${profiles_json}" | head -n1
          )"
          inbound_uuid="$(
            jq -r --arg name "${CONFIG_PROFILE_NAME}" --arg tag "${INBOUND_TAG}" \
              '(.response | if type == "array" then . else (.configProfiles // []) end)[] | select(.name == $name) | .inbounds[] | select(.tag == $tag) | .uuid' \
              <<<"${profiles_json}" | head -n1
          )"
          if [[ -z "${profile_uuid}" || -z "${inbound_uuid}" ]]; then
            echo "Config profile or inbound not found: ${CONFIG_PROFILE_NAME}/${INBOUND_TAG}" >&2
            exit 1
          fi

          nodes_json="$(curl --fail --silent --show-error "${auth[@]}" "${base_url}/api/nodes")"
          node_uuid="$(
            jq -r --arg name "${NODE_NAME}" \
              '(.response | if type == "array" then . else (.nodes // []) end)[]? | select(.name == $name) | .uuid' \
              <<<"${nodes_json}" | head -n1
          )"
          if [[ -z "${node_uuid}" ]]; then
            node_payload="$(mktemp)"
            jq -n \
              --arg name "${NODE_NAME}" \
              --arg address "${NODE_ADDRESS}" \
              --argjson port "${NODE_PORT}" \
              --arg country "${NODE_COUNTRY}" \
              --arg profile_uuid "${profile_uuid}" \
              --arg inbound_uuid "${inbound_uuid}" \
              '{
                name: $name,
                address: $address,
                port: $port,
                countryCode: $country,
                consumptionMultiplier: 1,
                nodeConsumptionMultiplier: 1,
                isTrafficTrackingActive: false,
                configProfile: {
                  activeConfigProfileUuid: $profile_uuid,
                  activeInbounds: [$inbound_uuid]
                }
              }' > "${node_payload}"
            node_response="$(curl --fail --silent --show-error -X POST "${json_auth[@]}" --data-binary @"${node_payload}" "${base_url}/api/nodes")"
            node_uuid="$(jq -r '.response.uuid' <<<"${node_response}")"
            rm -f "${node_payload}"
            echo "node_created=${NODE_NAME} uuid=${node_uuid}"
          else
            echo "node_exists=${NODE_NAME} uuid=${node_uuid}"
          fi

          hosts_json="$(curl --fail --silent --show-error "${auth[@]}" "${base_url}/api/hosts")"
          host_uuid="$(
            jq -r --arg remark "${HOST_REMARK}" --arg address "${HOST_ADDRESS}" --argjson port "${HOST_PORT}" \
              '(.response | if type == "array" then . else (.hosts // []) end)[]?
               | select((.remark == $remark) or (.address == $address and .port == $port))
               | .uuid' \
              <<<"${hosts_json}" | head -n1
          )"
          host_payload="$(mktemp)"
          jq -n \
            --arg profile_uuid "${profile_uuid}" \
            --arg inbound_uuid "${inbound_uuid}" \
            --arg node_uuid "${node_uuid}" \
            --arg remark "${HOST_REMARK}" \
            --arg address "${HOST_ADDRESS}" \
            --argjson port "${HOST_PORT}" \
            '{
              inbound: {
                configProfileUuid: $profile_uuid,
                configProfileInboundUuid: $inbound_uuid
              },
              remark: $remark,
              address: $address,
              port: $port,
              sni: "alanet.ru",
              fingerprint: "firefox",
              isDisabled: false,
              isHidden: false,
              serverDescription: "ALANET Germany 2",
              nodes: [$node_uuid]
            }' > "${host_payload}"
          if [[ -z "${host_uuid}" ]]; then
            host_response="$(curl --fail --silent --show-error -X POST "${json_auth[@]}" --data-binary @"${host_payload}" "${base_url}/api/hosts")"
            host_uuid="$(jq -r '.response.uuid' <<<"${host_response}")"
            echo "host_created=${HOST_REMARK} uuid=${host_uuid}"
          else
            jq --arg host_uuid "${host_uuid}" '. + {uuid: $host_uuid}' "${host_payload}" > "${host_payload}.with-uuid"
            mv "${host_payload}.with-uuid" "${host_payload}"
            curl --fail --silent --show-error -X PATCH "${json_auth[@]}" --data-binary @"${host_payload}" "${base_url}/api/hosts" >/dev/null
            echo "host_updated=${HOST_REMARK} uuid=${host_uuid}"
          fi
          rm -f "${host_payload}"

          sleep 10
          curl --fail --silent --show-error "${auth[@]}" "${base_url}/api/nodes" |
            jq -r --arg name "${NODE_NAME}" '(.response | if type == "array" then . else (.nodes // []) end)[]? | select(.name == $name) | "node_state=\(.name) connected=\(.isConnected) uuid=\(.uuid)"'
          curl --fail --silent --show-error "${auth[@]}" "${base_url}/api/hosts" |
            jq -r --arg address "${HOST_ADDRESS}" --argjson port "${HOST_PORT}" '(.response | if type == "array" then . else (.hosts // []) end)[]? | select(.address == $address and .port == $port) | "host_state=\(.remark) address=\(.address):\(.port) uuid=\(.uuid) disabled=\(.isDisabled)"'
          printf 'node_uuid_b64=%s\n' "$(printf '%s' "${node_uuid}" | base64 -w0)"
          printf 'host_uuid_b64=%s\n' "$(printf '%s' "${host_uuid}" | base64 -w0)"
          REMOTE
