name: Diagnose ALANET-DE-2 Remnawave host

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-alanet-de2-host.yml"
  workflow_dispatch:

concurrency:
  group: diagnose-alanet-de2-host
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add production host key
        run: ssh-keyscan -p "${{ secrets.PROD_SSH_PORT }}" -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts

      - name: Compare Germany hosts
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          ssh -p "$PROD_SSH_PORT" "$PROD_USER@$PROD_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          token="$(sudo sed -n 's/^REMNAWAVE_TOKEN=//p' /opt/alanet/deploy/.env)"
          auth=(-H "Authorization: Bearer ${token}")
          base_url="https://panel.alanet.ru"

          echo "== nodes =="
          curl --fail --silent --show-error "${auth[@]}" "${base_url}/api/nodes" |
            jq -r '(.response | if type == "array" then . else (.nodes // []) end)[]?
              | select(.name == "ALANET-DE-1" or .name == "ALANET-DE-2")
              | {name, uuid, address, port, isConnected, countryCode, activeConfigProfileUuid: .configProfile.activeConfigProfileUuid, activeInbounds: .configProfile.activeInbounds}'

          echo "== hosts =="
          curl --fail --silent --show-error "${auth[@]}" "${base_url}/api/hosts" |
            jq -r '(.response | if type == "array" then . else (.hosts // []) end)[]?
              | select(.address == "132.243.228.206" or .address == "144.31.214.244")
              | {
                  uuid,
                  remark,
                  address,
                  port,
                  sni,
                  host,
                  alpn,
                  fingerprint,
                  securityLayer,
                  xHttpExtraParams,
                  serverDescription,
                  isDisabled,
                  isHidden,
                  inbound,
                  nodes
                }'
          REMOTE
