name: Build and push production images

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "backend/**"
      - "Dockerfile.web"
      - "package.json"
      - "package-lock.json"
      - "backend/requirements.txt"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch:

concurrency:
  group: alanet-production-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/alanet-web:latest
            ${{ env.IMAGE_NAMESPACE }}/alanet-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.alanet.ru
            NEXT_PUBLIC_SITE_URL=https://account.alanet.ru
            NEXT_PUBLIC_CHECKOUT_ENABLED=false

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/alanet-backend:latest
            ${{ env.IMAGE_NAMESPACE }}/alanet-backend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add production host key
        run: ssh-keyscan -p ${{ secrets.PROD_SSH_PORT }} -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on production
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -p "$PROD_SSH_PORT" "$PROD_USER@$PROD_HOST" "set -e; cd /opt/alanet/deploy; sudo env ALANET_WEB_IMAGE='$IMAGE_NAMESPACE/alanet-web:$IMAGE_TAG' ALANET_BACKEND_IMAGE='$IMAGE_NAMESPACE/alanet-backend:$IMAGE_TAG' docker compose pull web api worker; sudo env ALANET_WEB_IMAGE='$IMAGE_NAMESPACE/alanet-web:$IMAGE_TAG' ALANET_BACKEND_IMAGE='$IMAGE_NAMESPACE/alanet-backend:$IMAGE_TAG' docker compose up -d --no-deps web api worker; sudo docker compose ps web api worker; sudo systemctl start alanet-healthcheck.service; sudo journalctl -u alanet-healthcheck.service -n 40 --no-pager -o cat"
