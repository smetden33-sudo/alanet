name: Build and push production images

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "backend/**"
      - "Dockerfile.web"
      - "package.json"
      - "package-lock.json"
      - "backend/requirements.txt"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/alanet-web:latest
            ${{ env.IMAGE_NAMESPACE }}/alanet-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.alanet.ru
            NEXT_PUBLIC_SITE_URL=https://account.alanet.ru
            NEXT_PUBLIC_CHECKOUT_ENABLED=false

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/alanet-backend:latest
            ${{ env.IMAGE_NAMESPACE }}/alanet-backend:${{ github.sha }}
