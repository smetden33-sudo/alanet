name: Build and push production images

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "backend/**"
      - "Dockerfile.web"
      - "package.json"
      - "package-lock.json"
      - "backend/requirements.txt"
      - "infra/deploy/alanet-disk-report"
      - "infra/deploy/alanet-disk-report.service"
      - "infra/deploy/alanet-disk-report.timer"
      - "infra/deploy/alanet-prod-ops-collector"
      - "infra/deploy/alanet-prod-ops-collector.service"
      - "infra/deploy/alanet-prod-ops-collector.timer"
      - "infra/deploy/verify-production.sh"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch:

concurrency:
  group: alanet-production-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/alanet-web:latest
            ${{ env.IMAGE_NAMESPACE }}/alanet-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.alanet.ru
            NEXT_PUBLIC_SITE_URL=https://account.alanet.ru
            NEXT_PUBLIC_CHECKOUT_ENABLED=false

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/alanet-backend:latest
            ${{ env.IMAGE_NAMESPACE }}/alanet-backend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add production host key
        run: ssh-keyscan -p ${{ secrets.PROD_SSH_PORT }} -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on production
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          scp -P "$PROD_SSH_PORT" infra/deploy/alanet-disk-report infra/deploy/alanet-disk-report.service infra/deploy/alanet-disk-report.timer infra/deploy/alanet-prod-ops-collector infra/deploy/alanet-prod-ops-collector.service infra/deploy/alanet-prod-ops-collector.timer infra/deploy/verify-production.sh "$PROD_USER@$PROD_HOST:/tmp/"
          ssh -p "$PROD_SSH_PORT" "$PROD_USER@$PROD_HOST" "set -e; bash -n /tmp/alanet-disk-report; bash -n /tmp/alanet-prod-ops-collector; bash -n /tmp/verify-production.sh; sudo mkdir -p /opt/alanet/infra/deploy /var/lib/alanet-monitor; sudo install -m 0755 /tmp/alanet-disk-report /opt/alanet/infra/deploy/alanet-disk-report; sudo install -m 0644 /tmp/alanet-disk-report.service /etc/systemd/system/alanet-disk-report.service; sudo install -m 0644 /tmp/alanet-disk-report.timer /etc/systemd/system/alanet-disk-report.timer; sudo install -m 0755 /tmp/alanet-prod-ops-collector /opt/alanet/infra/deploy/alanet-prod-ops-collector; sudo install -m 0644 /tmp/alanet-prod-ops-collector.service /etc/systemd/system/alanet-prod-ops-collector.service; sudo install -m 0644 /tmp/alanet-prod-ops-collector.timer /etc/systemd/system/alanet-prod-ops-collector.timer; sudo install -m 0755 /tmp/verify-production.sh /opt/alanet/infra/deploy/verify-production.sh; sudo install -m 0755 /tmp/verify-production.sh /usr/local/sbin/alanet-verify-production; sudo systemctl daemon-reload; sudo systemctl enable --now alanet-disk-report.timer alanet-prod-ops-collector.timer; sudo systemctl start alanet-disk-report.service alanet-prod-ops-collector.service; sudo python3 -m json.tool /var/lib/alanet-monitor/disk.status.json >/dev/null; sudo python3 -m json.tool /var/lib/alanet-monitor/prod-ops.status.json >/dev/null"
          ssh -p "$PROD_SSH_PORT" "$PROD_USER@$PROD_HOST" "set -e; cd /opt/alanet/deploy; sudo docker image prune -af || true; sudo docker builder prune -af || true; sudo docker container prune -f || true; sudo env ALANET_WEB_IMAGE='$IMAGE_NAMESPACE/alanet-web:$IMAGE_TAG' ALANET_BACKEND_IMAGE='$IMAGE_NAMESPACE/alanet-backend:$IMAGE_TAG' docker compose pull web api worker; sudo env ALANET_WEB_IMAGE='$IMAGE_NAMESPACE/alanet-web:$IMAGE_TAG' ALANET_BACKEND_IMAGE='$IMAGE_NAMESPACE/alanet-backend:$IMAGE_TAG' docker compose up -d --no-deps web api worker; sudo docker image prune -af || true; sudo docker builder prune -af || true; sudo docker container prune -f || true; sudo docker compose ps web api worker"
          for attempt in 1 2 3 4 5; do
            if ssh -p "$PROD_SSH_PORT" "$PROD_USER@$PROD_HOST" "sudo systemctl start alanet-healthcheck.service"; then
              ssh -p "$PROD_SSH_PORT" "$PROD_USER@$PROD_HOST" "sudo journalctl -u alanet-healthcheck.service -n 40 --no-pager -o cat; sudo cat /var/lib/alanet-monitor/health.state"
              exit 0
            fi
            ssh -p "$PROD_SSH_PORT" "$PROD_USER@$PROD_HOST" "sudo journalctl -u alanet-healthcheck.service -n 40 --no-pager -o cat || true; sudo cat /var/lib/alanet-monitor/health.summary 2>/dev/null || true"
            echo "Health-check attempt $attempt failed, waiting for services/load to settle..."
            sleep 30
          done
          exit 1
